# =============================================================================
# Multi-Platform Docker Build & Push to Docker Hub
# =============================================================================
# Triggers:
#   - Push to 'main' branch  → builds & pushes 'edge' tag
#   - Version tag (v*)        → builds & pushes version + 'latest' tag
#   - Manual workflow_dispatch → builds & pushes 'edge' tag
# =============================================================================

name: Build & Push Multi-Platform Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Cancel in-progress runs for the same branch/tag
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: mrtintnaingwin/nucleicnm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------
      # 1. Checkout repository
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 2. Set up QEMU (required for ARM64 emulation on x86 runner)
      # -----------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # -----------------------------------------------------------------
      # 3. Set up Docker Buildx (multi-platform builder)
      # -----------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------
      # 4. Login to Docker Hub
      # -----------------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------------------------------------
      # 5. Extract metadata (tags, labels) for Docker
      # -----------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # On push to main → 'edge'
            type=edge,branch=main
            # On tag push (v1.5.6) → '1.5.6'
            type=semver,pattern={{version}}
            # On tag push (v1.5.6) → '1.5' (minor)
            type=semver,pattern={{major}}.{{minor}}
            # On tag push → 'latest'
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # -----------------------------------------------------------------
      # 6. Build and push multi-platform image
      # -----------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build args passed to Dockerfile (Buildx auto-sets platform args)

      # -----------------------------------------------------------------
      # 7. Summary
      # -----------------------------------------------------------------
      - name: Image digest
        run: |
          echo "## 🐳 Docker Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags pushed:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
